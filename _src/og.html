<!doctype html>
<!-- Paylaşım görseli (assets/img/og.jpg) için. Üretmek: _src/README.md'deki Chrome komutu. -->
<html lang="en"><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0b1020;color:#eef1ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.b{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.b1{width:520px;height:520px;background:#6c8cff;top:-160px;left:-120px}.b2{width:460px;height:460px;background:#b46cff;bottom:-180px;right:180px}.b3{width:380px;height:380px;background:#2fe3c2;bottom:-160px;left:300px;opacity:.25}
.l{position:absolute;left:70px;top:0;bottom:0;width:600px;display:flex;flex-direction:column;justify-content:center}
.logo{width:120px;height:120px;filter:drop-shadow(0 14px 26px rgba(0,0,0,.45))}
h1{font-size:62px;line-height:1.05;margin:22px 0 8px;letter-spacing:-.02em}
h1 em{font-style:normal;background:linear-gradient(90deg,#6c8cff,#b46cff,#2fe3c2);-webkit-background-clip:text;background-clip:text;color:transparent}
p{font-size:25px;color:#9aa4c7;margin:0 0 26px}
.chips{display:flex;gap:10px}.chips span{padding:9px 16px;border:1px solid rgba(255,255,255,.18);border-radius:99px;background:rgba(255,255,255,.06);font-size:19px;font-weight:600}
.card{position:absolute;right:70px;top:95px;width:400px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:28px;padding:26px;box-shadow:0 30px 70px rgba(0,0,0,.45)}
.row{display:flex;justify-content:space-between;font-size:19px;color:#9aa4c7;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.1)}.row b{color:#eef1ff}
.big{margin-top:18px;text-align:center;background:rgba(127,127,127,.12);border-radius:20px;padding:18px}
.big small{display:block;color:#9aa4c7;font-size:18px}.big b{font-size:84px;letter-spacing:-.02em;background:linear-gradient(90deg,#6c8cff,#2fe3c2);-webkit-background-clip:text;background-clip:text;color:transparent}
</style></head><body>
<div class="b b1"></div><div class="b b2"></div><div class="b b3"></div>
<div class="l"><img class="logo" src="../assets/img/logo.png" alt="">
<h1>Grade Calculator<br><em>Not Hesaplayıcı</em></h1>
<p>Final grade · Course average · GPA</p>
<div class="chips"><span>Free</span><span>No ads</span><span>Offline</span><span>17 languages</span></div></div>
<div class="card">
<div class="row">Midterm <b>55</b></div><div class="row">Midterm weight <b>40%</b></div><div class="row">Target average <b>50</b></div>
<div class="big"><small>Final grade needed</small><b>47</b></div></div>
</body></html>
